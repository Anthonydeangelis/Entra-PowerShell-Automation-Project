name: Validate PowerShell

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test tools
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Parse all PowerShell without executing runbooks
        shell: pwsh
        run: |
          $files = Get-ChildItem ./src, ./scripts, ./showcase, ./tests -Recurse -File |
            Where-Object Extension -in '.ps1', '.psm1', '.psd1'
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "$($file.Name): $($errors.Message -join '; ')" }
          }

      - name: Analyze reusable code for errors
        shell: pwsh
        run: |
          foreach ($path in './src', './scripts') {
            Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error -EnableExit
          }

      - name: Run tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI -Output Detailed
